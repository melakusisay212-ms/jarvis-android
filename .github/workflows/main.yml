name: Build APK

# Builds a ready-to-install APK with the native engine (llama.cpp + whisper.cpp)
# so you only need to download the language models later.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | tail -1)"
          echo "Using cmdline-tools at: $CMDLINE"
          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install NDK and platform
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Make scripts executable
        run: chmod +x gradlew scripts/fetch_native.sh

      - name: Fetch native engines
        run: bash scripts/fetch_native.sh

      - name: Build debug APK (native enabled)
        run: ./gradlew assembleDebug -Pjarvis.buildNative=true --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
